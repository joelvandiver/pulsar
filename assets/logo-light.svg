<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Pulsar: a pulsing star held between two crab claws">
  <defs>
    <linearGradient id="beamN" x1="128" y1="128" x2="128" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F74C00" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F74C00" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamS" x1="128" y1="128" x2="128" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F74C00" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F74C00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starGlowL" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFB86B" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#FFB86B" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFB86B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- lighthouse beams -->
  <path d="M128 128 L116 34 L140 34 Z" fill="url(#beamN)"/>
  <path d="M128 128 L116 222 L140 222 Z" fill="url(#beamS)"/>
  <!-- pulse arcs -->
  <g fill="none" stroke="#F74C00" stroke-linecap="round">
    <path d="M106 81 A52 52 0 0 1 150 81" stroke-width="7" opacity=".85"/>
    <path d="M97 61 A74 74 0 0 1 159 61" stroke-width="6" opacity=".55"/>
    <path d="M87 41 A96 96 0 0 1 169 41" stroke-width="5" opacity=".3"/>
    <path d="M150 175 A52 52 0 0 1 106 175" stroke-width="7" opacity=".85"/>
    <path d="M159 195 A74 74 0 0 1 97 195" stroke-width="6" opacity=".55"/>
    <path d="M169 215 A96 96 0 0 1 87 215" stroke-width="5" opacity=".3"/>
  </g>
  <!-- claws -->
  <g fill="none" stroke="#F74C00" stroke-width="13" stroke-linecap="round">
    <path d="M9.5 -16.5 A19 19 0 1 1 -9.5 -16.5" transform="translate(62,128) rotate(90)"/>
    <path d="M9.5 -16.5 A19 19 0 1 1 -9.5 -16.5" transform="translate(194,128) rotate(-90)"/>
  </g>
  <!-- the neutron star -->
  <circle cx="128" cy="128" r="30" fill="url(#starGlowL)"/>
  <circle cx="128" cy="128" r="12" fill="#F74C00"/>
</svg>
